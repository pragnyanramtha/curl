[package]
name = "curl-rust"
version = "0.1.0"
edition = "2024"
license = "curl"
publish = false

[[bin]]
name = "curl"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
httpdate = "1.0"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "deflate", "gzip", "http2", "multipart", "rustls-tls"] }
ssh2 = "0.9.5"
thiserror = "2.0"
tokio = { version = "1.48", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "2.5"

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile = "3.23"
